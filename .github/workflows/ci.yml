name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 补发当前版本（标签不存在时即使本次未改 version.json 也发布预发行）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify · ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard hosted runner labels, verified against actions/runner-images.
          - os: macos-15
            platform: macos-arm64
            arch: arm64
            builder_args: --mac dmg --arm64
            extension: dmg
          - os: macos-15-intel
            platform: macos-x64
            arch: x64
            builder_args: --mac dmg --x64
            extension: dmg
          - os: windows-2022
            platform: windows-x64
            arch: x64
            builder_args: --win nsis --x64
            extension: exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CLOUDHELM_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set Node before pnpm bootstrap
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # v5 uses Node 24 and installs pnpm directly; v6 self-update fails for pnpm 11 on macOS Intel.
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: '3.12'
      - name: Configure Python for native addon builds
        env:
          BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PYTHON=' + process.env.BUILD_PYTHON + '\n')"
      - name: Verify runner architecture
        run: node -e "if (process.arch !== process.env.CLOUDHELM_EXPECTED_ARCH) throw new Error('Unexpected runner architecture ' + process.arch); console.log(process.platform, process.arch, process.version)"
      - name: Verify Windows C++ build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ x64 build tools are unavailable' }
          Write-Output "Native C++ tools: $installation"
          'npm_config_msvs_version=2022' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify macOS C++ build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select --print-path
          clang --version
      - name: Install locked dependencies and approved native builds
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.3'
      - name: Build and verify both static remote components
        run: pnpm build:native
      - name: Types, policies, and unit/integration tests
        run: pnpm check
      - name: Install browser for renderer smoke
        run: pnpm exec playwright install chromium
      - name: Renderer flows with fake SSH and models
        # 步骤级超时让挂死快速失败并保留 if: always() 的诊断产物，而不是拖到任务级超时被取消。
        timeout-minutes: 10
        run: pnpm test:ui
      - name: Safe Markdown rendering and copy-only code blocks
        timeout-minutes: 10
        run: pnpm test:markdown
      - name: Private file previews, line differences, expiry and approval authority
        timeout-minutes: 10
        run: pnpm test:file-preview
      - name: Build native desktop directory package
        run: pnpm --filter @cloudhelm/desktop package
      - name: Built Electron process and credential/native resources
        timeout-minutes: 10
        run: pnpm test:desktop
      - name: Packaged Electron process and credential/native resources
        timeout-minutes: 10
        run: pnpm test:desktop:packaged
      - name: Build unsigned DMG or NSIS distribution
        run: pnpm --filter @cloudhelm/desktop exec electron-builder ${{ matrix.builder_args }} --publish never
      - name: Save smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          include-hidden-files: true
          path: |
            .cache/ui-smoke/*.png
            .cache/markdown-smoke/*.png
            .cache/file-preview-smoke/*.png
            .cache/desktop-smoke/**/*.png
            .cache/desktop-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save unsigned desktop packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CloudHelm-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.${{ matrix.extension }}
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: verify
    # 发布只来自主线推送（开发仓库 dev / 总仓库默认分支）；其余分支只构建。
    # 手动触发且勾选 force_publish 时为尚未发布的当前版本补发。
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) ||
      (github.event_name == 'workflow_dispatch' && inputs.force_publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether to publish this version
        id: decision
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA" | grep -c '^version\.json$' || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA" | grep -c '^version\.json$' || true)
          fi
          if [ "$CHANGED" -gt 0 ]; then CHANGED_FLAG=true; else CHANGED_FLAG=false; fi
          VERSION=$(node -e "console.log(require('./version.json').version)")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then TAG_EXISTS=true; else TAG_EXISTS=false; fi
          echo "version.json changed: $CHANGED_FLAG, tag v$VERSION exists: $TAG_EXISTS"
          VERSION_FILE_CHANGED=$CHANGED_FLAG TAG_EXISTS=$TAG_EXISTS FORCE_PUBLISH=${FORCE_PUBLISH:-false} node scripts/release-decision.mjs
      - name: Download built installers
        if: steps.decision.outputs.should-publish == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: CloudHelm-*
          path: release-assets
      - name: Prepare release notes from CHANGELOG
        if: steps.decision.outputs.should-publish == 'true'
        id: notes
        env:
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          # 更新日志小节正文作为 Release 说明；缺条目或提取失败时回退纯自动生成（不拦截）。
          if node scripts/changelog.mjs "$VERSION" > release-notes.md 2> notes-error.log && [ -s release-notes.md ]; then
            echo "has-notes=true" >> "$GITHUB_OUTPUT"
          else
            cat notes-error.log >&2 || true
            echo "CHANGELOG.md 缺少 $VERSION 的条目或提取失败，Release 说明回退为自动生成" >&2
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create prerelease with installers
        if: steps.decision.outputs.should-publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decision.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has-notes }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then echo 'No built installers found' >&2; exit 1; fi
          # --notes-file 内容前置、--generate-notes 的提交清单附加在后；缺条目时只用自动生成。
          if [ "$HAS_NOTES" = 'true' ]; then
            gh release create "$TAG" --prerelease --generate-notes --title "CloudHelm $TAG" --notes-file release-notes.md "${assets[@]}"
          else
            gh release create "$TAG" --prerelease --generate-notes --title "CloudHelm $TAG" "${assets[@]}"
          fi
      - name: Skip publishing
        if: steps.decision.outputs.should-publish != 'true'
        env:
          REASON: ${{ steps.decision.outputs.reason }}
        run: echo "$REASON"
