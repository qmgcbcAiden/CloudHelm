name: Native Linux SSH and PAM
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapters:
    name: TypeScript SSH deployment and native protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.9.0
          run_install: false
      - name: Install locked dependencies and build both bundled ELF artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - name: Start empty isolated SSH fixture on loopback
        run: |
          set -euo pipefail
          mkdir -p .cache/adapter-fixture
          docker build -f Tests/native/fixture/Dockerfile.adapter -t cloudhelm-adapter-fixture Tests/native/fixture
          docker run -d --name cloudhelm-adapter-fixture --cap-add SYS_PTRACE -p 127.0.0.1:22388:22 cloudhelm-adapter-fixture
          for attempt in $(seq 1 40); do
            if docker exec cloudhelm-adapter-fixture test -f /fixture-ready; then break; fi
            sleep 0.25
          done
          docker exec cloudhelm-adapter-fixture test -f /fixture-ready
          docker cp cloudhelm-adapter-fixture:/home/cloudhelm/.ssh/id_ed25519 .cache/adapter-fixture/id_ed25519
          chmod 600 .cache/adapter-fixture/id_ed25519
      - name: Real TS stream installation, staged file commit, sudo and su
        env:
          CLOUDHELM_ISOLATED_FIXTURE: '1'
          CLOUDHELM_TEST_SSH_PORT: '22388'
          CLOUDHELM_TEST_SSH_USER: cloudhelm
        run: |
          set -euo pipefail
          export CLOUDHELM_TEST_SSH_KEY="$PWD/.cache/adapter-fixture/id_ed25519"
          test -s "$CLOUDHELM_TEST_SSH_KEY"
          pnpm exec vitest run Tests/adapters/ssh-transport.integration.test.ts Tests/adapters/native-command.integration.test.ts --reporter=verbose 2>&1 | tee .cache/adapter-fixture/results.log
          if grep -Eq '[1-9][0-9]* skipped' .cache/adapter-fixture/results.log; then
            echo 'Adapter integration must execute, never skip'; exit 1
          fi
      - name: Stop the disposable fixture
        if: always()
        run: docker rm -f cloudhelm-adapter-fixture || true

  native:
    name: Real SSH, sudo and su · ${{ matrix.arch }} · ${{ matrix.libc }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            libc: glibc
          - arch: amd64
            runner: ubuntu-24.04
            libc: musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            libc: glibc
          - arch: arm64
            runner: ubuntu-24.04-arm
            libc: musl
    runs-on: ${{ matrix.runner }}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build static helper and Linux integration binaries
        run: |
          set -euo pipefail
          mkdir -p .cache/native-fixture
          go mod verify
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o .cache/native-fixture/helper ./packages/adapters/native/cmd/cloudhelm-helper
          go test -c -o .cache/native-fixture/process.test ./Tests/native/process
          go test -c -o .cache/native-fixture/files.test ./Tests/native/files
          cp Tests/native/fixture/entrypoint.sh .cache/native-fixture/entrypoint.sh
          file .cache/native-fixture/helper
          if readelf -l .cache/native-fixture/helper | grep -q INTERP; then
            echo 'Helper must have no dynamic interpreter'; exit 1
          fi
      - name: Real sshd and PAM with no Python and disabled SFTP
        env:
          FIXTURE_LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          docker build -f "Tests/native/fixture/Dockerfile.$FIXTURE_LIBC" -t cloudhelm-native-fixture .cache/native-fixture
          # Full root can read the invoking user's /proc image. Docker omits this
          # capability by default; the separate negative run verifies refusal.
          docker run --rm --cap-add SYS_PTRACE --tmpfs /noexec:rw,noexec,nosuid,mode=1777 --tmpfs /readonly:ro,mode=755 cloudhelm-native-fixture 2>&1 | tee .cache/native-fixture/results.log
          docker run --rm --cap-drop SYS_PTRACE -e CLOUDHELM_FIXTURE_RESTRICTED_ROOT=1 cloudhelm-native-fixture 2>&1 | tee .cache/native-fixture/restricted-root.log
          if grep -q -- '--- SKIP:' .cache/native-fixture/results.log; then
            echo 'Native fixture coverage must not silently skip'; exit 1
          fi
